# Pre-commit 配置
# 目的：提交前用项目内的 Prettier 格式化 Markdown / YAML / JSON / 常见文本
repos:
  - repo: local
    hooks:
      - id: prettier-format-local
        name: Prettier (use project-installed prettier via npx)
        entry: npx prettier --write
        language: system
        files: "\\.(md|markdown|mdx|json|ya?ml|css|scss|html|js|ts|jsx|tsx)$"
        pass_filenames: true
